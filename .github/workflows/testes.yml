name: testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run teste
      # proposta de conhecimento vinda de empresa: sem dado da empresa, sem segredo, sem frase de ordem ao agente
      - name: verificar propostas
        shell: bash
        run: if [ -d propostas ]; then node hooks/travas.mjs texto propostas; fi

  # checagem unica para a regra da branch main exigir
  resultado:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - run: echo "testes ok"
